version: '3.8'

services:
  # Self-Hosted MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: automlops-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
      - ./artifacts:/artifacts
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Core AutoMLOps FastAPI Backend
  backend:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.10-slim
        WORKDIR /app
        RUN apt-get update && apt-get install -y --no-install-recommends curl git && rm -rf /var/lib/apt/lists/*
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        EXPOSE 8000
        CMD ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    container_name: automlops-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./automlops.db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GITHUB_WEBHOOK_SECRET=automlops-dev-secret
      - ENVIRONMENT=development
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./automlops.db:/app/automlops.db
      - /var/run/docker.sock:/var/run/docker.sock # For container deployments
    depends_on:
      - mlflow

  # React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:18-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm install
        COPY . .
        EXPOSE 3000
        CMD ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    container_name: automlops-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mlflow-data:
